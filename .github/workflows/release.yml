name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build universal app bundle
        run: make app-universal

      - name: Create zip archive
        run: cd build && zip -r -y ClaudeUsageBar-${{ steps.version.outputs.VERSION }}.zip ClaudeUsageBar.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ClaudeUsageBar ${{ steps.version.outputs.VERSION }}
          body: |
            ## Installation

            1. Download `ClaudeUsageBar-${{ steps.version.outputs.VERSION }}.zip` below
            2. Unzip the archive
            3. Drag `ClaudeUsageBar.app` to your **Applications** folder
            4. Right-click the app and select **Open** (required on first launch for unsigned apps)

            **Requirements:** macOS 13 or later — universal binary supports both Apple Silicon (arm64) and Intel (x86_64) Macs.
          files: build/ClaudeUsageBar-${{ steps.version.outputs.VERSION }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true
